services:
  sample-source:
    build: .
    image: agri-price-collector:local
    command:
      - python
      - -m
      - sample_source.app
    environment:
      SAMPLE_HOST: 0.0.0.0
      SAMPLE_PORT: "8001"
      # Rows are generated for this day and the day before, so the demo form
      # can be submitted with this date as-is.
      SAMPLE_DAY: "2026-11-10"
    expose:
      - "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  collector:
    build: .
    image: agri-price-collector:local
    depends_on:
      sample-source:
        condition: service_healthy
    environment:
      COLLECTOR_DATA_DIR: /data
      COLLECTOR_LOG_LEVEL: INFO
      # Shared by all gunicorn workers so flash messages survive a restart.
      COLLECTOR_SECRET: ${COLLECTOR_SECRET:-change-me-in-production}
    ports:
      - "8000:8000"
    volumes:
      - collector-data:/data
    restart: unless-stopped

volumes:
  collector-data:
